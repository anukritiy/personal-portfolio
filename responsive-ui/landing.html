<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopEase | Landing Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-logo">ShopEase</div>
    <ul class="nav-links" id="navLinksStore">
      <li><a href="index.html">Portfolio</a></li>
      <li><a href="#products">Products</a></li>
      <li><a href="#about-store">About</a></li>
    </ul>
    <button class="nav-toggle" id="navToggleStore">☰</button>
  </nav>

  <header class="hero">
    <h1>Everything Your Home Needs</h1>
    <p>Quality products, delivered fast.</p>
    <button class="cta-btn">Shop Now</button>
  </header>

  <section id="products" class="section">
    <h2>Featured Products</h2>
    <div class="product-grid">
      <div class="product-card">
        <h3>Product 1</h3>
        <p>₹499</p>
      </div>
      <div class="product-card">
        <h3>Product 2</h3>
        <p>₹799</p>
      </div>
      <div class="product-card">
        <h3>Product 3</h3>
        <p>₹1299</p>
      </div>
      <div class="product-card">
        <h3>Product 4</h3>
        <p>₹349</p>
      </div>
    </div>
  </section>

  <section id="about-store" class="section">
    <h2>About Us</h2>
    <p>We're a local store bringing quality products to your doorstep.</p>
  </section>

  <script src="script.js"></script>
</body>
</html>
